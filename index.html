<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shaky Pete’s: Salmon Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e4e8f3; --ink:#161a36; --muted:#4b5078; --pad:#c7cde3; --padink:#161a36; --edge:#9aa2c4;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#0b0d22; --ink:#e9e7f3; --muted:#9a9cc0; --pad:#1d2148; --padink:#e9e7f3; --edge:#33386a; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#0b0d22; --ink:#e9e7f3; --muted:#9a9cc0; --pad:#1d2148; --padink:#e9e7f3; --edge:#33386a; color-scheme:dark; }
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Silkscreen",ui-monospace,Menlo,monospace;display:flex}
.wrap{margin:auto;width:100%;max-width:1200px;padding:12px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:10px}
.stage{position:relative;width:100%;display:flex;flex-direction:column;align-items:center}
canvas{display:block;width:100%;max-width:min(100%,calc((100dvh - 70px)*16/9));height:auto;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;border-radius:6px;touch-action:none;outline:none}
canvas:focus-visible{box-shadow:0 0 0 3px #ff9e2c}
.help{margin:0;color:var(--muted);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;text-align:center;line-height:1.7;max-width:70ch}
.help b{color:var(--ink);font-weight:600}
.pad{display:none}
.touch .help{display:none}
.touch canvas{max-width:min(100%,calc((100dvh - 210px)*16/9))}
.touch .pad{display:flex;width:100%;max-width:520px;justify-content:space-between;align-items:center;margin-top:14px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.dpad{width:132px;height:132px;border-radius:50%;background:var(--pad);border:2px solid var(--edge);position:relative;touch-action:none}
.dpad span{position:absolute;width:0;height:0;border:9px solid transparent;opacity:.7}
.dpad .u{left:57px;top:10px;border-bottom:12px solid var(--padink);border-top:0}
.dpad .d{left:57px;bottom:10px;border-top:12px solid var(--padink);border-bottom:0}
.dpad .l{top:57px;left:10px;border-right:12px solid var(--padink);border-left:0}
.dpad .r{top:57px;right:10px;border-left:12px solid var(--padink);border-right:0}
.btns{display:flex;gap:12px;align-items:center}
.btns button{font:inherit;font-size:12px;color:var(--padink);background:var(--pad);border:2px solid var(--edge);border-radius:50%;width:76px;height:76px;touch-action:none;padding:0;line-height:1.2}
.btns button.act{width:88px;height:88px;background:#ff9e2c;color:#1a0f02;border-color:#c46f12}
.btns button.pause{width:40px;height:40px;border-radius:10px;font-size:11px}
.btns button.on{filter:brightness(1.25)}
@media (orientation:landscape){
  .touch canvas{max-width:min(100%,calc((100dvh - 24px)*16/9))}
  .touch .pad{position:absolute;left:0;right:0;bottom:8px;max-width:none;margin:0;padding:0 12px;box-sizing:border-box;pointer-events:none}
  .touch .pad > *{pointer-events:auto;opacity:.6}
}
</style>
</head>
<body>
<main class="wrap">
  <div class="stage">
    <canvas id="game" width="480" height="270" tabindex="0" aria-label="Shaky Pete’s: Salmon Run, a side-scrolling street game"></canvas>
    <div class="pad" id="pad">
      <div class="dpad" id="dpad"><span class="u"></span><span class="d"></span><span class="l"></span><span class="r"></span></div>
      <div class="btns">
        <button class="pause" data-k="tPause" aria-label="Pause">II</button>
        <button data-k="tAnswer">Phone</button>
        <button data-k="tDodge">Dodge</button>
        <button class="act" data-k="tAct">Brush off</button>
      </div>
    </div>
  </div>
  <p class="help"><b>Move</b> arrows or WASD. <b>Brush off</b> J, Z or space. <b>Dodge</b> K, X or shift. <b>Answer phone</b> C. <b>Pause</b> P. <b>Mute</b> M.<br>Find rosettes and napkins on the street, then press Brush off next to a lady to hand her the one she’s after.<br>Shaky Petes restore composure and hit harder, but every one makes you woozier.</p>
</main>
<script>
'use strict';
const W=480,H=270,FY0=186,FY1=244,LEVEL_END=5200,CASINO_DOOR=5040,STEP=1/60;
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const buf=document.createElement('canvas');buf.width=W;buf.height=H;const g=buf.getContext('2d');
ctx.imageSmoothingEnabled=false;g.imageSmoothingEnabled=false;
const FS='8px "Silkscreen", ui-monospace, monospace';
const FM='8px "Press Start 2P", ui-monospace, monospace';
const FL='16px "Press Start 2P", ui-monospace, monospace';
const FXL='20px "Press Start 2P", ui-monospace, monospace';
try{document.fonts.load(FS);document.fonts.load(FM);}catch(e){}
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=a=>a[Math.random()*a.length|0];
function mulberry(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- characters ---------- */
const CHARS=[
  {name:'Martin',tag:['Navy suit,','all-rounder'],speed:1.6,power:1.0,tol:1.0,escape:1.0,
   pal:{skin:'#e9b48c',hair:'#3b2718',top:'#22305a',top2:'#1a2547',collar:'#f4f4f4',tie:'#4f8cf0',legs:'#22305a',shoes:'#141414'}},
  {name:'Ross',tag:['Dying to tell you','about his physio'],chat:['So, my physio...','Physio reckons it’s my glutes','Remind me about my physio','Knee’s loads better, by the way','My physio would hate this'],speed:1.25,power:1.5,tol:1.5,escape:1.2,
   pal:{skin:'#f0c09c',hair:'#f0c09c',bald:true,tshirt:true,pack:true,top:'#c8342b',legs:'#34507e',shoes:'#141414'}},
  {name:'Mike',tag:['Tall tech guy,','quick on his feet'],speed:2.1,power:0.8,tol:0.7,escape:0.9,
   pal:{skin:'#e3b08a',hair:'#6b4a2a',glasses:true,tshirt:true,top:'#2fae6a',legs:'#34507e',shoes:'#ececec',scale:1.12}},
  {name:'Jon P',tag:['Tall, slips out','of any grab'],speed:1.6,power:0.9,tol:1.0,escape:1.9,
   pal:{skin:'#e0a982',hair:'#120c08',slick:true,scale:1.12,tshirt:true,top:'#26262e',legs:'#2c4670',shoes:'#ececec'}},
];
const SKINS=['#f0c09c','#e0a982','#c68a5e','#8d5a3b','#5e3a24'];
const HAIRS=['#111','#3b2718','#6b4a2a','#c9a35a','#222','#8a8a8a'];
const TOUT={top:'#3b3b46',top2:'#2c2c36',legs:'#26324a',shoes:'#e8e8e8',lanyard:'#ff4fa3',glasses:true};
const DRESSES=[['#c8243b','#8e1829'],['#1f1f2a','#111118'],['#2f6fd6','#1f4c9a'],['#e8c25a','#b89238'],['#2fae6a','#1f7a4a'],['#b04fd0','#7a3492'],['#f2f2f2','#c8c8d0']];
const LADY_X=[560,880,1200,1650,2050,2450,2800,3150,3650,4000,4380,4760];
const GIFT_THANKS={rosette:['A rosette! Adorable','Ooh, first prize!','Aww, thank you'],napkin:['How thoughtful','A napkin! What a gent','Just what I needed']};
const GIVE_LINES=['For you, madam','Compliments of the lads','With our regards'];
const FLYER={top:'#2a2a33',top2:'#22222a',vest:'#d8f03a',legs:'#33344a',shoes:'#0a0a0a'};
const BOUNCER={skin:'#9a6a48',bald:true,top:'#16161c',collar:'#f4f4f4',tie:'#0c0c10',legs:'#16161c',shoes:'#000',earpiece:true,glasses:true};
const ALI={skin:'#c89a6e',hair:'#16100c',slick:true,beard:true,glasses:true,top:'#b8894a',collar:'#f4f4f4',tie:'#1c1c24',legs:'#1c1c24',shoes:'#0a0a0a'};
const ALI_BAG=Object.assign({},ALI,{whiteBag:true});
const PHONE_X=1980,GATE_X=2560,ALI_X=2710,ALI_Y=208;
const CALL_LINES=[{who:'ali',t:'Lads! It’s Senior Ali.'},{who:'ali',t:'Heard you’re on the Shaky Petes. Course you are.'},{who:'ali',t:'Meet me at Soho Square. I’ve got something for the casino.'},{who:'me',t:'On our way, Ali.'}];
const MEET_LINES=[{who:'ali',t:'There they are. Looking sharp, gents.'},{who:'ali',t:'Here, this white bag’s for you lads.'},{who:'ali',t:'Salmons are inside. Don’t let the touts get their hands on it.'},{who:'ali',t:'The Golden Salmon’s expecting you. Go on.'},{who:'me',t:'Legend.'}];

const TOUT_LINES=['Lads! In here!','Free entry, boys','Two for one tonight','Just one drink, mate','VIP for you lot','Best night in Soho','Quick look, lads'];
const FLYER_LINES=['Take a flyer!','Half price entry!','Free shot inside','Lads, catch!'];
const GRAB_LINES=['Nearly there, mate','Trust me, lads','You’ll love it','Ten minutes, tops'];
const FLEE_LINES=['Your loss!','Fine, tight git','Next lot then','Suit yourself'];
const DRINK_LINES=['Shaky Pete!','Ahh, lovely','Cheers lads','Just the one...'];
const WOOZY_LINES=['Whoa...','I’m fine. FINE.','Who moved the street?','Is it me or...'];

/* ---------- level ---------- */
const CLUBS=['PEACHES','VELVET ROOM','PINK FLAMINGO','SUGAR','CHERRY LOUNGE','DIAMONDS','THE CATWALK','MIDNIGHT','HONEY','SATIN'];
const SHOPS=['KEBABS','OFF LICENCE','24HR SHOP','CHICKEN','PHONE REPAIRS','NOODLES','BUREAU DE CHANGE'];
const NEON=['#ff4fa3','#ff3b5c','#c86bff','#4fe3ff','#ffd23f'];
const BRICK=['#4c2a2a','#3a3352','#46392b','#2c3a4c','#3d2f3f'];
const SECTIONS=[{x:0,n:'Hawksmoor, Air Street'},{x:420,n:'Piccadilly Circus'},{x:1900,n:'Soho'},{x:3300,n:'Leicester Square'},{x:4860,n:'The Golden Salmon'}];
const WAVES=[
  {x:430,e:['tout','tout']},
  {x:980,e:['tout','flyer','tout']},
  {x:1550,e:['flyer','tout','tout','flyer']},
  {x:2200,e:['tout','tout','flyer','tout']},
  {x:2900,e:['flyer','tout','flyer','tout','tout']},
  {x:3600,e:['tout','tout','flyer','tout','tout']},
  {x:4300,e:['tout','flyer','tout','flyer','tout','tout']},
  {x:4620,e:['bouncer','tout']},
];
const PICKS=[[110,205,'pete'],[200,232,'pete'],[760,214,'pete'],[1300,226,'salmon'],[1420,200,'pete'],[2050,236,'pete'],[2600,210,'salmon'],[2750,230,'pete'],[3400,200,'pete'],[3500,236,'salmon'],[4100,222,'pete'],[4200,198,'salmon'],[4500,230,'pete'],
  [250,236,'napkin'],[600,200,'rosette'],[1100,232,'napkin'],[1800,210,'rosette'],[2400,226,'napkin'],[3000,200,'rosette'],[3300,236,'napkin'],[3900,212,'rosette'],[4350,200,'napkin'],[4600,216,'rosette']];
let buildings=[],doors=[],props=[],stars=[];
function genLevel(){
  const r=mulberry(7);buildings=[];doors=[];props=[];
  let x=280,ci=0,si=0;
  while(x<4880){
    if(x===2600){buildings.push({x,w:200,park:true,win:[]});x+=200;continue;}
    let w=Math.round(96+r()*64); if(x+w>4880)w=4880-x; if(x<2600&&x+w>2600)w=2600-x;
    const club=w>=80&&r()<0.5, h=Math.round(72+r()*62);
    const b={x,w,h,col:BRICK[(r()*BRICK.length)|0],club,name:club?CLUBS[ci++%CLUBS.length]:SHOPS[si++%SHOPS.length],neon:NEON[(r()*NEON.length)|0],win:[]};
    const rows=w<40?0:Math.max(0,Math.floor((h-46)/18)),cols=Math.max(1,Math.floor((w-12)/16)),pad=((w-cols*16)/2|0)+4;
    for(let i=0;i<rows;i++)for(let j=0;j<cols;j++)b.win.push({x:pad+j*16,y:8+i*18,lit:r()<0.45});
    if(x>=300&&x<1000)b.screen=true;
    buildings.push(b);
    if(club)doors.push({x:x+(w/2|0),name:b.name});
    else if(r()<0.4)props.push({x:x+10+(r()*(w-30)|0),type:r()<0.6?'phone':'bin'});
    x+=w;
  }
  const rs=mulberry(3);for(let i=0;i<40;i++)stars.push({x:rs()*W*2,y:rs()*90,b:rs()});
}
genLevel();

/* ---------- input ---------- */
const MAP={left:['ArrowLeft','a','A','tLeft'],right:['ArrowRight','d','D','tRight'],up:['ArrowUp','w','W','tUp'],down:['ArrowDown','s','S','tDown'],
  act:['j','J','z','Z',' ','tAct'],dodge:['k','K','x','X','Shift','tDodge'],start:['Enter','tap'],answer:['c','C','tAnswer'],pause:['p','P','Escape','tPause']};
const held={},pressedQ=new Set();
const hd=a=>MAP[a].some(k=>held[k]);
const hp=a=>MAP[a].some(k=>pressedQ.has(k));
let muted=false;
addEventListener('keydown',e=>{
  unlockAudio();
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();
  if(e.key==='m'||e.key==='M'){muted=!muted;return;}
  if(!held[e.key])pressedQ.add(e.key);held[e.key]=true;
});
addEventListener('keyup',e=>{held[e.key]=false;});
addEventListener('blur',()=>{for(const k in held)held[k]=false;});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(state==='play'||state==='casino')){prevState=state;state='paused';}});

if(matchMedia('(pointer:coarse)').matches||'ontouchstart' in window)document.body.classList.add('touch');
document.querySelectorAll('.btns button').forEach(b=>{
  const k=b.dataset.k;
  const down=e=>{e.preventDefault();unlockAudio();held[k]=true;pressedQ.add(k);b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch(_){}};
  const up=()=>{held[k]=false;b.classList.remove('on')};
  b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
const dpad=document.getElementById('dpad');
function dpadSet(e){
  const r=dpad.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),t=r.width*0.14;
  const set=(k,v)=>{if(v&&!held[k])pressedQ.add(k);held[k]=v;};
  set('tLeft',dx<-t);set('tRight',dx>t);set('tUp',dy<-t);set('tDown',dy>t);
}
function dpadClear(){held.tLeft=held.tRight=held.tUp=held.tDown=false;}
dpad.addEventListener('pointerdown',e=>{e.preventDefault();unlockAudio();try{dpad.setPointerCapture(e.pointerId)}catch(_){}dpadSet(e);});
dpad.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')dpadSet(e);});
dpad.addEventListener('pointerup',dpadClear);dpad.addEventListener('pointercancel',dpadClear);
cv.addEventListener('pointerdown',e=>{
  unlockAudio();cv.focus();
  const r=cv.getBoundingClientRect(),lx=(e.clientX-r.left)/r.width*W;
  if(state==='select'){const i=clamp(Math.floor((lx-12)/117),0,3);if(i===sel)pressedQ.add('tap');else{sel=i;snd(440,0.05);}}
  else if(state==='title'||state==='over'||state==='win')pressedQ.add('tap');
  else if(state==='paused')pressedQ.add('tPause');
  else if(state==='dialog')pressedQ.add('tap');
  else if(state==='play'&&phone.stage===1)pressedQ.add('tAnswer');
});

/* ---------- audio ---------- */
let AC=null;
function unlockAudio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function snd(f,d=0.08,type='square',vol=0.04,slide=0){
  if(muted||!AC)return;
  try{const o=AC.createOscillator(),gn=AC.createGain(),t=AC.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.linearRampToValueAtTime(Math.max(30,f+slide),t+d);
    gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(gn).connect(AC.destination);o.start(t);o.stop(t+d+0.02);}catch(e){}
}

/* ---------- state ---------- */
let state='title',prevState='play',sel=0,C=CHARS[0],P=null,T=0,camX=0,lock=false,lockR=W,waveIdx=0,spawnQ=[],enemies=[],proj=[],floats=[],pickups=[];
let ladies=[],phone={stage:0,ring:0},ali={},dlg=null,secIdx=-1,goT=0,ambient=6,shake=0,bannerText='',bannerT=0,endT=0,casinoT=0,rain=[],rainT=0,overMsg='',best=0,newBest=false;
try{best=parseInt(localStorage.getItem('spsr-best')||'0',10)||0;}catch(e){}

function newGame(){
  C=CHARS[sel];
  P={x:150,y:220,face:1,state:'idle',t:0,hp:100,woozy:0,lives:3,salmons:0,invuln:1,atkCd:0,dodgeCd:0,slow:0,combo:0,comboT:0,escape:0,grabbedBy:null,anim:0,lurch:0,lurchV:0,say:'',sayT:0,vx:0,vy:0,drinkT:0,rosettes:0,napkins:0,gifts:0};
  camX=0;lock=false;lockR=W;waveIdx=0;spawnQ=[];enemies=[];proj=[];floats=[];secIdx=-1;goT=0;ambient=6;shake=0;bannerT=0;
  pickups=PICKS.map(([x,y,type])=>({x,y,type,t:Math.random()*6}));
  phone={stage:0,ring:0};ali={x:ALI_X,y:ALI_Y,face:-1,anim:0,leaveT:0,moving:false};P.onPhone=false;
  ladies=LADY_X.map((x,i)=>{const d=DRESSES[i%DRESSES.length],y=FY0+8+Math.random()*(FY1-FY0-16);
    return {x,y,ax:x,ay:y,tx:x,ty:y,wt:Math.random()*2,face:-1,anim:Math.random()*5,moving:false,given:false,happyT:0,say:'',sayT:0,wish:Math.random()<0.5?'rosette':'napkin',
      pal:{skin:rnd(SKINS),hair:rnd(HAIRS),longHair:true,dress:true,top:d[0],top2:d[1],shoes:Math.random()<0.5?'#111':'#c8243b'}};});
  state='play';snd(330,0.1,'square',0.05,330);
  say(P,C.chat?'Did I tell you about my physio?':'Right lads. Casino.');
}
function say(ent,s){ent.say=s;ent.sayT=2.1;}
function banner(s,d=2.4){bannerText=s;bannerT=d;}
function float(x,y,s,col){floats.push({x,y,s,col,t:1.1});}

/* ---------- enemies ---------- */
function spawnEnemy(type,side,wave){
  const x=side<0?camX-24:camX+W+24,y=FY0+Math.random()*(FY1-FY0);
  const pal=type==='bouncer'?BOUNCER:Object.assign({},type==='flyer'?FLYER:TOUT,{skin:rnd(SKINS),hair:rnd(HAIRS)});
  if(type==='flyer'&&Math.random()<0.5)pal.cap=rnd(['#d8f03a','#111','#ff4fa3']);
  const e={type,x,y,face:-side,hp:type==='bouncer'?150:type==='flyer'?22:32,state:'approach',t:0,cd:0.8+Math.random(),vx:0,flash:0,
    anim:Math.random()*5,say:'',sayT:0,pal,wave,spd:type==='bouncer'?40:type==='flyer'?60:52+Math.random()*16,door:null,throwT:0,oy:(Math.random()-0.5)*8,moving:false};
  e.max=e.hp;enemies.push(e);
  if(type==='bouncer'){say(e,'Not so fast, gents');banner('The Doorman');}
  else if(Math.random()<0.6)say(e,rnd(type==='flyer'?FLYER_LINES:TOUT_LINES));
}
function startWave(){
  lock=true;lockR=camX+W;
  spawnQ=WAVES[waveIdx].e.map((t,i)=>({type:t,d:i*0.7,side:i%2?-1:1}));
}
function nearestDoor(x){
  let best=null,bd=1e9;
  for(const d of doors){if(d.x<camX+12||d.x>camX+W-12)continue;const dd=Math.abs(d.x-x);if(dd<bd){bd=dd;best=d;}}
  return best;
}
function moveToward(e,tx,ty,dt){
  const dx=tx-e.x,dy=ty-e.y,m=e.spd*dt;
  e.x+=clamp(dx,-m,m);e.y+=clamp(dy,-m*0.6,m*0.6);
  e.moving=Math.abs(dx)>2||Math.abs(dy)>2;
}
function grab(e){
  e.state='grab';e.door=nearestDoor(P.x);
  P.state='grabbed';P.grabbedBy=e;P.escape=0;
  snd(90,0.18,'triangle',0.07);say(e,rnd(GRAB_LINES));say(P,'Oi! Get off!');
}
function breakFree(){
  const e=P.grabbedBy;
  if(e){e.state='stun';e.t=1.1;e.vx=(Math.sign(e.x-P.x)||1)*170;e.hp-=8;e.flash=0.15;if(e.hp<=0){e.state='flee';say(e,rnd(FLEE_LINES));drop(e);}}
  P.state='idle';P.grabbedBy=null;P.escape=0;P.invuln=0.9;

function drop(e){

  if(r<0.25)pickups.push({x:e.x,y:e.y,type:'pete',t:0});
  else if(r<0.4)pickups.push({x:e.x,y:e.y,type:'salmon',t:0});
  else if(r<0.52)pickups.push({x:e.x,y:e.y,type:'rosette',t:0});
  else if(r<0.64)pickups.push({x:e.x,y:e.y,type:'napkin',t:0});
}
function updEnemy(e,dt){
  e.anim+=dt;e.flash=Math.max(0,e.flash-dt);e.sayT-=dt;e.throwT-=dt;e.moving=false;
  if(e.state==='flee'){e.x+=e.vx*dt;e.moving=true;if(e.x<camX-60||e.x>camX+W+60)e.dead=true;return;}
  if(e.state==='stun'){e.x+=e.vx*dt;e.vx*=Math.pow(0.015,dt);e.t-=dt;if(e.t<=0){e.state='approach';e.cd=Math.max(e.cd,0.6);}e.y=clamp(e.y,FY0,FY1);return;}
  if(e.state==='grab'){
    if(P.state!=='grabbed'||P.grabbedBy!==e){e.state='stun';e.t=0.5;e.vx=0;return;}
    P.hp-=(e.type==='bouncer'?8:5)*dt;
    const d=e.door;
    if(d){
      const dir=Math.sign(d.x-P.x)||1;
      P.x+=dir*(e.type==='bouncer'?42:34)*dt;P.y=Math.max(FY0,P.y-22*dt);
      e.x=P.x+dir*13;e.y=P.y+0.5;e.face=-dir;P.face=dir;e.moving=true;
      if(Math.abs(d.x-P.x)<5&&P.y<=FY0+6)draggedIn(e,d);
    }else{e.x=P.x+P.face*13;e.y=P.y+0.5;e.face=-P.face;}
    if(e.sayT<=0&&Math.random()<dt*0.8)say(e,rnd(GRAB_LINES));
    return;
  }
  const side=Math.sign(e.x-P.x)||1,pBusy=P.state==='grabbed';
  e.cd-=dt;
  if(e.type==='flyer'){
    moveToward(e,P.x+side*95,P.y+e.oy,dt);e.face=-side;
    if(e.cd<=0&&Math.abs(P.y-e.y)<16&&e.x>camX&&e.x<camX+W){
      proj.push({x:e.x-side*8,y:e.y,vx:-side*150,t:0});e.cd=2.2+Math.random()*1.2;e.throwT=0.25;snd(600,0.05,'square',0.02,200);
    }
  }else{
    if(e.state==='windup'){
      e.t-=dt;
      if(e.t<=0){
        const inR=Math.abs(e.x-P.x)<22&&Math.abs(e.y-P.y)<9;
        if(inR&&!pBusy&&P.invuln<=0&&P.state!=='dodge')grab(e);else{e.state='approach';e.cd=1;}
      }
      return;
    }
    moveToward(e,P.x+side*(pBusy?48:14),P.y+e.oy,dt);e.face=-side;
    if(!pBusy&&e.cd<=0&&Math.abs(e.x-P.x)<20&&Math.abs(e.y-P.y)<8&&P.invuln<=0){
      e.state='windup';e.t=e.type==='bouncer'?0.6:0.42;
    }
  }
  if(e.sayT<=-1.5&&Math.random()<dt*0.15)say(e,rnd(e.type==='flyer'?FLYER_LINES:TOUT_LINES));
  e.y=clamp(e.y,FY0,FY1);
}

/* ---------- player ---------- */
function doAttack(){
  P.state='attack';P.t=0.2;P.atkCd=0.28;snd(220,0.06,'square',0.035,-80);
  P.combo=P.comboT>0?P.combo+1:1;P.comboT=0.7;
  const big=P.combo>=3;if(big)P.combo=0;
  const pw=C.power*(1+P.woozy/140)*(big?1.8:1);
  let hit=false;
  for(const e of enemies){
    if(e.state==='flee'||e.dead)continue;
    const reach=e.type==='bouncer'?32:26,dx=(e.x-P.x)*P.face;
    if(dx>-4&&dx<reach&&Math.abs(e.y-P.y)<11){
      e.hp-=10*pw;e.flash=0.12;e.state='stun';e.t=big?0.9:0.35;e.vx=P.face*(big?220:110)*(e.type==='bouncer'?0.4:1);hit=true;
      if(e.hp<=0){e.state='flee';e.vx=P.face*160;say(e,rnd(FLEE_LINES));drop(e);}
    }
  }
  if(hit){snd(140,0.08,'sawtooth',0.05,-60);shake=big?4:2;if(big)float(P.x+P.face*20,P.y-40,'Shove!','#ffd23f');}
}
function updatePlayer(dt,minX,maxX,minY,maxY){
  P.invuln=Math.max(0,P.invuln-dt);P.atkCd-=dt;P.dodgeCd-=dt;P.slow=Math.max(0,P.slow-dt);P.comboT-=dt;P.drinkT-=dt;P.sayT-=dt;
  P.woozy=Math.max(0,P.woozy-2.2*dt);P.anim+=dt;
  if(C.chat&&P.sayT<-6&&Math.random()<dt*0.12)say(P,rnd(C.chat));
  if(P.state==='down'){P.t-=dt;if(P.t<=0){P.state='idle';P.invuln=1;say(P,'...I’m up. I’m up.');}}
  else if(P.state==='grabbed'){
    if(hp('act')){P.escape+=14*C.escape/(P.grabbedBy&&P.grabbedBy.type==='bouncer'?2:1);snd(300+P.escape*4,0.04,'square',0.03);}
    P.escape=Math.max(0,P.escape-12*dt);
    if(P.escape>=100)breakFree();
  }
  else if(P.state==='dodge'){P.t-=dt;P.x+=P.vx*dt;P.y+=P.vy*dt;if(P.t<=0)P.state='idle';}
  else if(P.state==='attack'){P.t-=dt;if(P.t<=0)P.state='idle';}
  else{
    const ix=(hd('right')?1:0)-(hd('left')?1:0),iy=(hd('down')?1:0)-(hd('up')?1:0);
    const sp=C.speed*60*(P.slow>0?0.55:1);
    P.x+=ix*sp*dt;P.y+=iy*sp*0.7*dt;if(ix)P.face=ix;
    P.state=(ix||iy)?'walk':'idle';
    if(hp('act')&&P.atkCd<=0){const l=giveTarget();if(l)tryGive(l);else doAttack();}
    else if(hp('dodge')&&P.dodgeCd<=0){
      P.state='dodge';P.t=0.32;P.dodgeCd=0.7;P.vx=(ix||(iy?0:P.face))*230;P.vy=iy*140;P.invuln=Math.max(P.invuln,0.32);snd(500,0.08,'triangle',0.04,-250);
    }
  }
  if(P.state!=='down'&&P.state!=='grabbed'){
    const w=P.woozy/100;
    P.x+=Math.sin(T*2.1)*w*28*dt;P.y+=Math.cos(T*1.55)*w*18*dt;
    if(w>0.6&&P.lurch<=0&&Math.random()<dt*0.45&&P.state!=='attack'){P.lurch=0.3;P.lurchV=(Math.random()<0.5?-1:1)*75;say(P,rnd(WOOZY_LINES));}
    if(P.lurch>0){P.lurch-=dt;P.x+=P.lurchV*dt;}
  }
  if(P.woozy>=100&&P.state!=='down'&&P.state!=='grabbed'){P.state='down';P.t=2.6;P.woozy=55;banner('Too many Shaky Petes!');snd(160,0.5,'triangle',0.05,-100);}
  P.x=clamp(P.x,minX,maxX);P.y=clamp(P.y,minY,maxY);
}
function giveTarget(){return ladies.find(l=>!l.given&&Math.abs(l.x-P.x)<28&&Math.abs(l.y-P.y)<14);}
function tryGive(l){
  P.atkCd=0.4;P.face=Math.sign(l.x-P.x)||P.face;

function updLadies(dt){

    l.wt-=dt;if(l.wt<=0){l.wt=1.5+Math.random()*2.5;l.tx=l.ax+(Math.random()-0.5)*70;l.ty=clamp(l.ay+(Math.random()-0.5)*20,FY0,FY1);}
    const dx=l.tx-l.x,dy=l.ty-l.y;l.moving=Math.abs(dx)>2||Math.abs(dy)>2;

/* ---------- update ---------- */
function updatePlay(dt){
  const minX=camX+8;let maxX=lock?lockR-8:LEVEL_END-10;
  if(phone.stage<2)maxX=Math.min(maxX,GATE_X);else if(phone.stage===2)maxX=Math.min(maxX,ali.x+30);
  updatePlayer(dt,minX,maxX,FY0,FY1);
  updPhone(dt);if(state!=='play')return;
  if(!lock)camX=Math.max(camX,Math.min(P.x-190,LEVEL_END-W));
  while(secIdx+1<SECTIONS.length&&P.x>=SECTIONS[secIdx+1].x){secIdx++;banner(SECTIONS[secIdx].n);}
  if(!lock&&waveIdx<WAVES.length&&P.x>=WAVES[waveIdx].x)startWave();
  for(const s of spawnQ){s.d-=dt;if(s.d<=0&&!s.done){s.done=true;spawnEnemy(s.type,s.side,true);}}
  spawnQ=spawnQ.filter(s=>!s.done);
  if(lock&&spawnQ.length===0&&!enemies.some(e=>e.wave&&e.state!=='flee'&&!e.dead)){
    lock=false;waveIdx++;goT=2.5;snd(660,0.1,'square',0.04);setTimeout(()=>snd(880,0.12,'square',0.04),110);
  }
  if(!lock&&P.x<4580){ambient-=dt;if(ambient<=0){if(enemies.filter(e=>e.state!=='flee').length<2)spawnEnemy(Math.random()<0.7?'tout':'flyer',1,false);ambient=5+Math.random()*4;}}
  for(const e of enemies)updEnemy(e,dt);
  updLadies(dt);
  enemies=enemies.filter(e=>!e.dead);
  for(const p of proj){
    p.x+=p.vx*dt;p.t+=dt;
    if(P.invuln<=0&&P.state!=='dodge'&&Math.abs(p.x-P.x)<8&&Math.abs(p.y-P.y)<9){
      p.hit=true;P.hp-=8;P.slow=1.5;float(P.x,P.y-44,'Flyered!','#ff4fa3');snd(180,0.08,'square',0.04);shake=2;
    }
  }
  proj=proj.filter(p=>!p.hit&&p.t<3);
  if(P.state!=='grabbed'&&P.state!=='down'){
    for(const pk of pickups)if(Math.abs(pk.x-P.x)<12&&Math.abs(pk.y-P.y)<10){pk.taken=true;takePickup(pk);}
    pickups=pickups.filter(p=>!p.taken);
  }
  for(const pk of pickups)pk.t+=dt;
  updFloats(dt);
  goT-=dt;bannerT-=dt;shake*=Math.pow(0.02,dt);
  if(P.hp<=0&&state==='play')loseLife('You gave in. “Just one,” they said.');
  if(state==='play'&&!lock&&waveIdx>=WAVES.length&&P.x>=CASINO_DOOR-6)startCasino();
}

function update(dt){
  T+=dt;
  if(state==='title'){if(hp('start')||hp('act')){state='select';snd(440,0.08);}}
  else if(state==='select'){
    if(hp('left')){sel=(sel+3)%4;snd(440,0.05);}
    if(hp('right')){sel=(sel+1)%4;snd(440,0.05);}

}

function bubble(c,s,x,y){

  const bx=clamp(Math.round(x-w/2),2,W-w-2),by=Math.round(y-14);

  c.fillStyle='#fff';c.fillRect(bx,by,w,11);c.fillRect(Math.round(x)-2,by+11,4,3);

  if(live)drawHUD(ctx);
  if(state==='dialog')drawDialog(ctx);
  if(state==='paused'){ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);txt(ctx,'Paused',W/2,H/2-8,{font:FL,col:'#fff',align:'center'});txt(ctx,'Press P or tap to carry on',W/2,H/2+16,{align:'center',col:'#cfd7ff'});}
}

/* ---------- loop ---------- */
let last=performance.now(),acc=0;
function frame(now){
  acc+=Math.min(0.1,(now-last)/1000);last=now;
  while(acc>=STEP){update(STEP);acc-=STEP;}
  render();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
